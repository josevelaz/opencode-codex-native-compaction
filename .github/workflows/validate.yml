name: Validate

on:
  workflow_call:
    inputs:
      ref:
        description: Exact SHA or branch head to check out
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Exact SHA or branch head to check out
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Validate
        run: bun run validate
